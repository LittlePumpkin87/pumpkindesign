<div class="card-wrapper">
  @for (card of items(); track $index) {
    @if (card.variant === 'simple') {
      <a class="card simple" [href]="card.cta?.href">
        <img class="card-image" [src]="card.imgSrc" [alt]="card.imgAlt" />
        <lpd-icon
          [iconName]="card.icon?.name"
          [color]="card.icon?.color"
          [iconPrefix]="card.icon?.prefix || 'far'"
        ></lpd-icon>
        <h4 class="card-headline">{{ card.headline }}</h4>
        <div [innerHTML]="card.text"></div>
      </a>
    }
    @if (card.variant === 'reference') {
      <div class="card reference">
        <img class="card-image" [src]="card.imgSrc" [alt]="card.imgAlt" />
        <h4 class="card-subline">{{ card.subline }}</h4>
        @if (card.cta) {
          <lpd-link class="card-cta" [item]="card.cta"></lpd-link>
        }
      </div>
    }
  }
</div>
