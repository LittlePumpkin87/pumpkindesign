@if (item()?.isInternal) {
  <a class="link" [routerLink]="item()?.href" [fragment]="item()?.fragment" [target]="'_self'">
    {{ item()?.label }}
    <lpd-icon [iconName]="item()?.iconName" [iconPrefix]="item()?.iconPrefix || 'fas'"></lpd-icon>
  </a>
} @else {
  <a class="link" [attr.href]="item()?.href" [target]="'_blank'">
    {{ item()?.label }}
    <lpd-icon [iconName]="item()?.iconName" [iconPrefix]="item()?.iconPrefix || 'fas'"></lpd-icon>
  </a>
}
