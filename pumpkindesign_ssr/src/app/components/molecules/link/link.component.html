@if (!item()?.routerLink) {
  <a class="link" [href]="item()?.href" target="_blank">
    {{ item()?.label }}
  </a>
} @else {
  <a class="link" [routerLink]="item()?.routerLink" target="_self">
    {{ item()?.label }}
    @if (item()?.iconName) {
      <lpd-icon
        [iconPrefix]="item()?.iconPrefix"
        [iconName]="item()?.iconName"
      ></lpd-icon>
    }
  </a>
}
