<header>
  <lpd-navigation [logoData]="header()" [items]="navData()"></lpd-navigation>
</header>
<main>

  <h1 class="headline">{{ page()?.main_headline_h1 }}</h1>

  <lpd-content-renderer [content]="page()?.content"></lpd-content-renderer>
</main>
