events {
    worker_connections 1024;
}

http {
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        
        ssl_certificate /etc/ssl/certs/server.crt;
        ssl_certificate_key /etc/ssl/private/server.key;

        return 444; 
    }

    server {
        listen 80;
        server_name littlepumpkindesign.de www.littlepumpkindesign.de;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name littlepumpkindesign.de www.littlepumpkindesign.de;
        
        ssl_certificate /etc/ssl/certs/server.crt;
        ssl_certificate_key /etc/ssl/private/server.key;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;

        location ~ /\. {
            return 444;
        }
        location ~* ^/(api/v1|api/v2|api/settings|api/config|api/env|api/openapi|\.env|\.ssh|\.git|settings\.|storage|config|swagger|\.well-known) {
            return 444;
        }
        location ~* ^/(wp-admin|wp-content|wp-includes|wp-json|wp-login|xmlrpc|phpmyadmin|pma|cgi-bin|typo3|joomla|magento|manifest|asset-manifest|build-manifest|robots|sitemap) {
            return 444;
        }
        location ~* \.(php|env|git|bak|sql|tar|gz|zip|yml|yaml|ini|log|sh)$ {
            return 444;
        }
        
        location ~ \.(?!js$|css$|png$|jpe?g$|gif$|ico$|svg$|webp$|woff2?$|ttf$|eot$|json$|webmanifest$|txt$|xml$|pdf$|mp4$)[a-zA-Z0-9]+$ {
            return 444;
        }
        location / {
            proxy_pass http://angular_frontend:4200;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/uploads/ {
        rewrite ^/api/(.*) /$1 break;
        
        proxy_pass http://strapi:6466;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        }
    }
}