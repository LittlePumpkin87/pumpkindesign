events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # --- PERFORMANCE & TIMEOUTS ---
    # Schutz vor Slowloris-Angriffen
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;

    # Schutz vor Buffer Overflows / gigantischen Uploads (für Strapi anpassen falls nötig)
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # --- KOMPRIMIERUNG ---
    # text/html wird bei aktivem gzip immer komprimiert und gehoert nicht in gzip_types
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    # --- NGINX BEHAVIOR ---
    # Verhindert das Umgehen von Regeln durch doppelte Slashes (z.B. //api//env)
    merge_slashes on;

    # Dockers eingebautes DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. Catch-All für fremde Domains / IP-Direktaufrufe
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate /etc/ssl/certs/server.crt;
        ssl_certificate_key /etc/ssl/private/server.key;

        return 444;
    }

    # 2. HTTP zu HTTPS Redirect
    server {
        listen 80;
        server_name littlepumpkindesign.de www.littlepumpkindesign.de;
        return 301 https://$host$request_uri;
    }

    # 3. Hauptserver
    server {
        listen 443 ssl;
        http2 on;
        server_name littlepumpkindesign.de www.littlepumpkindesign.de;

        ssl_certificate /etc/ssl/certs/server.crt;
        ssl_certificate_key /etc/ssl/private/server.key;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;

        # --- CRAWLER ---
        
        location = /index.html {
            return 301 /;
        }

        # --- SICHERHEITS-BLOCKLISTS ---

        # Leere oder offensichtlich gefälschte User-Agents blockieren
        if ($http_user_agent ~* "^(-?)$") {
            return 444;
        }

        # Ungültige oder gefährliche HTTP-Methoden blockieren
        if ($request_method !~ ^(GET|HEAD|POST|OPTIONS|PUT|PATCH|DELETE)$) {
            return 444;
        }

        # Directory Traversal Angriffe blockieren
        location ~* (\.\.\/|\.\.%2f) {
            return 444;
        }
        # well-known erlauben
        location ^~ /.well-known/ {
            set $wellknown_upstream http://angular_frontend:4200;
            proxy_pass $wellknown_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Alle uebrigen versteckten Dateien und Verzeichnisse blocken
        location ~ /\. {
            return 444;
        }

        # Konfigurations- & API-Reconnaissance abwehren
        location ~* ^/(api/v1|api/v2|api/settings|api/config|api/env|api/openapi|storage|config|swagger|aws|openapi|debug|debugbar|_debugbar|runtime-config|chosen)(/|$) {
            return 444;
        }

        # settings.* blockieren
        location ~* ^/settings\. {
            return 444;
        }

        # Spezifische Root-JSON-Scans abfangen
        location ~* ^/(firebase-config|app-config|env|settings|aws|openapi|swagger)\.json$ {
            return 444;
        }

        # Framework-, CMS- & Webmail-Scans
        location ~* ^/(wp-admin|wp-content|wp-includes|wp-json|wp-login|xmlrpc|phpmyadmin|pma|cgi-bin|typo3|joomla|magento|livewire|__firebase|vendor|phpunit|alfacgiapi|server/php|administrator|plugins|components|ckeditor|kcfinder|owa|autodiscover|_next|__nextjs|__rsc|_rsc|_middleware|RSC)(/|$) {
            return 444;
        }

        # Schädliche Dateiendungen und Skript-Artefakte global verbieten
        location ~* \.(php|asp|aspx|jsp|jhtml|cgi|pl|cfm|env|git|bak|sql|tar|gz|zip|yml|yaml|ini|log|sh|credentials|orig|save|swp|swo|old|tmp|temp|backup)(~)?$ {
            return 444;
        }

        # Strenge Extension-Whitelist
        location ~ \.(?!js$|css$|png$|jpe?g$|gif$|ico$|svg$|webp$|woff2?$|ttf$|eot$|json$|webmanifest$|txt$|xml$|pdf$|mp4$)[a-zA-Z0-9]+$ {
            return 444;
        }

        # --- ROUTING ---

        # Strapi Backend Uploads
        location /api/uploads/ {
            set $strapi_upstream http://strapi:6466;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass $strapi_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            expires 30d;
        }

        # Angular Frontend
        location / {
            set $frontend_upstream http://angular_frontend:4200;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
