name: Branch Check

on:
  push:
    branches-ignore: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [pumpkindesign_ssr, strapi_pumpkindesign_ssr, pumpkin_api]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: List vulnerabilities
        working-directory: ${{ matrix.project }}
        run: npm audit --color=always || true

      - name: Write vulnerability summary
        working-directory: ${{ matrix.project }}
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          npm audit --json | jq -r '
            {"critical": "🔴", "high": "🟠", "moderate": "🟡", "low": "⚪", "info": "⚪"} as $icon
            | {"critical": 0, "high": 1, "moderate": 2, "low": 3, "info": 4} as $rank
            | .metadata.vulnerabilities as $count
            | "## \(env.PROJECT)",
              "",
              "🔴 \($count.critical) critical · 🟠 \($count.high) high · 🟡 \($count.moderate) moderate · ⚪ \($count.low) low",
              "",
              "| | Package | Severity | Affected versions |",
              "|---|---|---|---|",
              (.vulnerabilities | map(.) | sort_by($rank[.severity]) | .[]
                | "| \($icon[.severity]) | \(.name) | \(.severity) | \(.range | gsub("\\|"; "\\|")) |")
          ' >> "$GITHUB_STEP_SUMMARY"


