name: Branch Check

on:
  push:
  pull_request:
    branches: ["main"]
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [pumpkindesign_ssr, strapi_pumpkindesign_ssr, pumpkin_api]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Check for high and critical vulnerabilities
        working-directory: ${{ matrix.project }}
        run: npm audit --audit-level=high

  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [pumpkindesign_ssr, strapi_pumpkindesign_ssr, pumpkin_api]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build -f ${{ matrix.project }}/Dockerfile.prod ${{ matrix.project }}