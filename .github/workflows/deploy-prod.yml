name: Build and Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-images:
    name: Build on GitHub Cloud
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build and Push Angular
      run: |
        docker build -t ghcr.io/littlepumpkin87/pumpkin-frontend:latest -f ./pumpkindesign_ssr/Dockerfile.prod ./pumpkindesign_ssr
        docker push ghcr.io/littlepumpkin87/pumpkin-frontend:latest

    - name: Build and Push Strapi
      run: |
        docker build -t ghcr.io/littlepumpkin87/pumpkin-strapi:latest -f ./strapi_pumpkindesign_ssr/Dockerfile.prod ./strapi_pumpkindesign_ssr
        docker push ghcr.io/littlepumpkin87/pumpkin-strapi:latest

  deploy-nas:
    name: Deploy to Synology NAS
    needs: build-images
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to GitHub Container Registry on NAS
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Pull and Deploy via Docker Compose
      env: 
        STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
        DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
        DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
        DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        SSL_CERT_PATH: ${{ secrets.SSL_CERT_PATH }}
        SSL_KEY_PATH: ${{ secrets.SSL_KEY_PATH }}
        NAS_HTTP_PORT: ${{ secrets.NAS_HTTP_PORT }}
        NAS_HTTPS_PORT: ${{ secrets.NAS_HTTPS_PORT }}
        IP_V4: ${{ secrets.IP_V4 }}
      run: |
        docker compose -f docker-compose.yml pull
        docker compose -f docker-compose.yml up -d