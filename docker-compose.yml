services:
  # --- NGINX ---
  nginx_proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "${NAS_HTTP_PORT}:80"
      - "${NAS_HTTPS_PORT}:443"
    environment:
      - IP_V4=${IP_V4}
    networks:
      Pumpkindesign:
        ipv4_address: ${IP_V4}
      pumpkindesign_default:
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${SSL_CERT_PATH}:/etc/ssl/certs/server.crt:ro
      - ${SSL_KEY_PATH}:/etc/ssl/private/server.key:ro
    depends_on:
      - angular_frontend
  
  # --- ANGULAR FRONTEND ---
  angular_frontend:
    container_name: angular_prod
    build:
      context: ./pumpkindesign_ssr
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4200
      - STRAPI_API_TOKEN=${STRAPI_API_TOKEN}
      - BASE_PATH_STRAPI=http://strapi:1337
    networks:
      - pumpkindesign_default
    depends_on:
      - strapi

  # --- STRAPI BACKEND ---
  strapi:
    container_name: strapi_prod
    build:
      context: ./strapi_pumpkindesign_ssr
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=strapiDB
      - DATABASE_PORT=5432
      - PORT=1337
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - STRAPI_API_TOKEN=${STRAPI_API_TOKEN}
    ports:
      - "127.0.0.1:1337:1337"
    networks:
      - pumpkindesign_default
    depends_on:
      strapiDB:
        condition: service_healthy

  # --- POSTGRES DATENBANK ---
  strapiDB:
    container_name: strapiDB
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - strapi-data:/var/lib/postgresql/data/
    networks:
      - pumpkindesign_default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  strapi-data:

networks:
  Pumpkindesign:
    external: true
  pumpkindesign_default:
    external: true